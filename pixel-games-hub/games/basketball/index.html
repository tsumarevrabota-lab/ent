<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Bankshot 🏀</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .back-nav {
      margin-bottom: 15px;
      width: 100%;
      max-width: 900px;
    }
    .btn-back {
      color: #94a3b8;
      text-decoration: none;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-back:hover { color: #f97316; }
    #game-canvas { border: 4px solid #334155; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="back-nav">
    <a href="../../index.html" class="btn-back">← Назад в Библиотеку</a>
  </div>

  <div id="ui-container">
    <div id="menu">
      <h1>🏀 PIXEL BANKSHOT</h1>
      <p>Зарабатывай больше очков за сложные рикошеты!</p>
      <div style="margin-top: 15px;">
        <button id="btn-bot" class="btn-play" style="display:inline-block; margin-right: 10px;">Играть с Ботом</button>
        <button id="btn-local" class="btn-play" style="display:inline-block;">2 Игрока (За одним ПК)</button>
      </div>
    </div>

    <div id="game-info" class="game-card" style="display:none; flex-direction:row; align-items:center; gap:20px; padding:10px 20px;">
      <div id="score-board" style="display:flex; gap:20px; font-weight:bold;">
        <span id="p1-score">Игрок 1: 0</span>
        <span id="multiplier" style="color:#facc15;">Множитель: x1</span>
        <span id="p2-score">Бот: 0</span>
      </div>
      <button id="btn-restart" class="btn-play" style="padding: 6px 12px; font-size: 0.9rem;">Заново</button>
    </div>
  </div>

  <div id="game-canvas"></div>

  <script src="game.js"></script>
</body>
</html>
